# Defending in the agent engine: how a defender's own ratings decide how closely he marks his
# man and how often he gets in the way of a shot (behaviours._defend, actions.shot_chance).
#
# Better attackers already pass, control and finish better. Before 2.3f nothing a defender was
# rated for changed where he stood, so equal sides took more shots the better both were:
# 31 shots a match at quality 58 and 49 at 82, with box entries nearly flat (34.5 -> 39.5 a
# team) and shots per box entry rising .45 -> .62 (step2.3f/sweep0, 120 matches each). Real
# leagues take about the same number of shots at every level.
#
# With the shot and first-touch pressure below, and a carrier weighing up the defender in his
# way with the duel's scores (actions._carry_options), goals rise 11% from quality 58 to 82
# instead of 58% (sweep2). Real squads, 200 matches each: Premier League 3.76 goals and League
# Two 3.05 (4.18 and 2.19 before). The level that remains, too many shots at every quality, is
# the defensive shape's (Phase D).

marking:
  # Ratings at which the values below are as they were before 2.3f: an average marker
  # behaves as before, and a better or worse one tighter or looser.
  reference: 60
  goal_side: 1.8            # m he stands goal-side of his man at the reference...
  goal_side_per_point: 0.02 # ...less this per point of marking above it (more below)
  goal_side_min: 0.9        # and never closer than this
  commitment: 0.45          # share of the way from his zone to his man at the reference...
  commitment_per_point: 0.0   # ...plus this per point of marking (the role's track_runners
                              # adds up to 0.3 on top). 0.012 (iteration 1) pulled markers out
                              # of their zones after their men: more and better shots against
  commitment_max: 0.95
blocks:
  # Outfield players only: a shot at the keeper is his to save (actions.shot_chance). At the
  # reference, an average Premier League defender, the per-blocker chance is fitted so that the
  # model blocks as many shots as were blocked in the Premier League 2015/16 (29%, matching in
  # every distance band; calibration/shot_fit.py). It was 0.28 at a reference of 60 before.
  reference: 75
  near: 0.8                 # m in front of the ball a defender can block a shot from...
  far: 14.0                 # ...to this far (or the goal line, if nearer)
  reach: 0.9                # m either side of a shot's line a defender can block it, at the
  reach_per_point: 0.012    # reference def_positioning, and this more per point of it...
  reach_min: 0.3            # ...but never less than this
  chance: 0.48              # chance each blocker blocks it, at the reference bravery...
  chance_per_point: 0.004   # ...and this more per point of it...
  chance_max: 0.9           # ...up to this
  max: 0.65                 # however many are in the way. Several blockers' chances combine as
                            # independent tries (two at the reference: 0.48; it was 0.28 each
                            # added up, 0.56, before 2.3f)
shot_pressure:
  # The pressure term of the fitted shot model (shooting.yaml chance.closeness): how close the
  # nearest outfield defender is, 1 on top of the shooter and 0 at the radius, for an average
  # Premier League shooter (composure 74) and defender (positioning and tackling 75).
  radius: 5.0               # m: an opponent this close puts the shooter off...
  reference: 75
  per_point: 0.01           # ...more the better he is: positioning and tackling, per point
                            # above the reference (so 1.05x at 80, 0.75x at 50)...
  composure_reference: 74   # ...and less the more composed the shooter: (1.2 - composure / 100)
                            # against (1.2 - this / 100)
touch_pressure:
  reference: 60
  per_point: 0.015          # an opponent at a receiver's first touch puts him off this much
                            # more per point of marking above the reference (1.3x at 80, 0.85x
                            # at 50), as his own first touch makes it matter less
clearances:
  # A defender who reaches a loose ball, an interception or a stray pass in his own danger zone
  # with an attacker closing in often clears it first time instead of controlling it
  # (actions._clears_first_time): real defending breaks attacks up this way. Real clearances
  # (Premier League 2015/16, StatsBomb open data) are 28.5 a team a match: 14.7 in their own box
  # and 8.8 in the rest of the defensive third; the engine made about 3. These values double it.
  # Most real clearances are crosses headed away, and the engine plays a third of the real
  # number of crosses (2.3c's decision values), so the count can't be matched yet: starting
  # values, not fitted.
  box: 0.8                  # chance in his own box with an attacker on top of him...
  third: 0.4                # ...elsewhere in the defensive third (35 m from his goal)...
  radius: 6.0               # ...falling to nothing with the nearest attacker this far away
  composure_reference: 70   # a calmer defender controls it more often: (1.2 - composure / 100)
                            # against (1.2 - this / 100)
