groups: ["2030-06-13", "2030-06-18", "2030-06-23"]
round_of_32: "2030-06-29"
round_of_16: "2030-07-04"
quarter_finals: "2030-07-09"
semi_finals: "2030-07-14"
third_place: "2030-07-18"
final: "2030-07-19"
