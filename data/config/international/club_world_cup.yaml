# The FIFA Club World Cup (W10, world/international/club_world_cup.py): 32 clubs every four years,
# FIFA's 2025 format, from 2029.
#
# Entrants (each confederation's `slots`, at most `per_country` clubs of one country, unless
# more won the continental title):
#   UEFA: the Champions League winners of the editions in the career before the draw, then the
#         best by UEFA's club coefficient (europe/coefficients.py).
#   the others: the clubs of the confederation's leagues in the game and its guest clubs (below),
#         ranked by strength: a club's level (the average overall of its best 16 players; a
#         guest's `level`) plus `title_bonus` for each league title in the seasons before the
#         draw (standing in for the continental titles until W9b adds those competitions).
#   the host: the host country's best-ranked club not already in.
# FIFA hasn't chosen a 2029 host: `host` is a choice to change freely.

first_year: 2029
every_years: 4
host: USA
draw: "12-05"  # the draw's month and day, the year before
title_bonus: 3.0
# The tournament (C2): 8 groups of 4, then single-match knockouts, at neutral venues.
dates:
  groups: ["06-15", "06-19", "06-24"]
  round_of_16: "06-28"
  quarter_finals: "07-04"
  semi_finals: "07-08"
  final: "07-13"
# Prize money (EUR; FIFA's 2025 amounts in dollars at about 0.92), paid to clubs with finances
# (guests have none): participation by confederation when the draw is made; each group win and
# draw; then each round reached (cumulative); the winners' extra.
prizes:
  participation: {UEFA: 20000000, CONMEBOL: 14000000, CONCACAF: 8700000, AFC: 8700000, CAF: 8700000, OFC: 3200000}
  win: 1840000
  draw: 920000
  round_of_16: 6900000
  quarter_finals: 12100000
  semi_finals: 19300000
  final: 27600000
  champions: 9200000
slots:
  UEFA: {slots: 12, per_country: 2}
  CONMEBOL: {slots: 6, per_country: 4}
  CONCACAF: {slots: 4, per_country: 2}
  AFC: {slots: 4, per_country: 2}
  CAF: {slots: 4, per_country: 2}
  OFC: {slots: 1, per_country: 1}

# Guest clubs: real clubs of the regions the game has no league for. They play only the Club
# World Cup; their squads are made-up players of their country at `level` (a best XI's average
# overall), who also count as their country's home-based players (for its national team).
# The levels are estimates from the clubs' standing (continental titles, the 2025 Club World Cup,
# Opta's club rankings), set against the game's leagues: Brazil's best clubs about 78, MLS's
# about 72.
