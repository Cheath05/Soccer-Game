key: ENG4
name: EFL League Two
short_name: League Two
nation: ENG
tier: 4
clubs: 24
sim_level: simulated
calendar: ENG-2026-27
format: {type: round_robin, legs: 2}
tiebreakers: [points, goal_difference, goals_for, h2h_points, h2h_goal_difference,
              h2h_goals_for, h2h_away_goals_for, drawing_of_lots]
# Real life: bottom two are relegated to the National League. There is no National League
# data yet (EA FC doesn't include it), so relegation from League Two is disabled until
# generated non-league clubs exist.
movements:
  - {kind: promotion, ranks: [1, 3], to: ENG3}
playoffs:
  - key: ENG4_PO
    name: League Two Play-offs
    winner_to: ENG3
    rounds:
      - name: Semi-finals
        legs: 2
        host: higher_ranked
        ties:
          - {id: SF1, a: {rank: 4}, b: {rank: 7}}
          - {id: SF2, a: {rank: 5}, b: {rank: 6}}
      - name: Final
        legs: 1
        host: neutral
        ties:
          - {id: F, a: {winner_of: [SF1]}, b: {winner_of: [SF2]}}
