# Conventions as in 4-3-3.yaml.

key: "4-1-4-1"
name: 4-1-4-1
description: Back four, a holding midfielder screening them, a midfield four, and a lone striker.
slots:
  - {id: GK,  position: GK, default_role: goalkeeper,           base: {x: .04, y: .50}}
  - {id: LB,  position: LB, default_role: full_back,            base: {x: .22, y: .12}}
  - id: LCB
    position: CB
    default_role: central_defender
    base: {x: .18, y: .37}
    phase_offsets:
      build_up: {dx: -.03, dy: -.06}
  - id: RCB
    position: CB
    default_role: central_defender
    base: {x: .18, y: .63}
    phase_offsets:
      build_up: {dx: -.03, dy: .06}
  - {id: RB,  position: RB, default_role: full_back,            base: {x: .22, y: .88}}
  - id: DM
    position: DM
    default_role: defensive_midfielder
    base: {x: .30, y: .50}
    phase_offsets:
      build_up: {dx: -.03}
  - id: LM
    position: LM
    default_role: wide_midfielder
    base: {x: .47, y: .14}
    phase_offsets:
      def_low: {dx: -.06}
  - {id: LCM, position: CM, default_role: box_to_box,           base: {x: .45, y: .38}}
  - {id: RCM, position: CM, default_role: central_midfielder,   base: {x: .45, y: .62}}
  - id: RM
    position: RM
    default_role: wide_midfielder
    base: {x: .47, y: .86}
    phase_offsets:
      def_low: {dx: -.06}
  - id: ST
    position: ST
    default_role: advanced_forward
    base: {x: .69, y: .50}
    phase_offsets:
      def_low: {dx: -.08}
relationships:
  - {type: back_line, slots: [LB, LCB, RCB, RB]}
  - {type: single_pivot, slots: [DM]}
  - {type: midfield_line, slots: [LM, LCM, RCM, RM]}
  - {type: flank_unit, slots: [LB, LM]}
  - {type: flank_unit, slots: [RB, RM]}
