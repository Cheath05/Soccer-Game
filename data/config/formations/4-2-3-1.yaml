# See 4-3-3.yaml for field conventions.

key: "4-2-3-1"
name: 4-2-3-1
description: Back four, a double pivot, three attacking midfielders and a lone striker.
slots:
  - {id: GK,  position: GK, default_role: goalkeeper,         base: {x: .04, y: .50}}
  - {id: LB,  position: LB, default_role: full_back,          base: {x: .22, y: .12}}
  - id: LCB
    position: CB
    default_role: central_defender
    base: {x: .18, y: .37}
    phase_offsets:
      build_up: {dx: -.03, dy: -.06}
  - id: RCB
    position: CB
    default_role: central_defender
    base: {x: .18, y: .63}
    phase_offsets:
      build_up: {dx: -.03, dy: .06}
  - {id: RB,  position: RB, default_role: full_back,          base: {x: .22, y: .88}}
  - {id: LDM, position: DM, default_role: defensive_midfielder, base: {x: .34, y: .38}}
  - {id: RDM, position: DM, default_role: deep_lying_playmaker, base: {x: .34, y: .62}}
  - id: LAM
    position: LW
    default_role: winger
    base: {x: .58, y: .14}
    phase_offsets:
      def_mid: {dx: -.08}
      def_low: {dx: -.14}
  - {id: CAM, position: AM, default_role: attacking_midfielder, base: {x: .57, y: .50}}
  - id: RAM
    position: RW
    default_role: inside_forward
    base: {x: .58, y: .86}
    phase_offsets:
      def_mid: {dx: -.08}
      def_low: {dx: -.14}
  - id: ST
    position: ST
    default_role: advanced_forward
    base: {x: .72, y: .50}
    phase_offsets:
      def_low: {dx: -.08}
relationships:
  - {type: back_line, slots: [LB, LCB, RCB, RB]}
  - {type: double_pivot, slots: [LDM, RDM]}
  - {type: flank_unit, slots: [LB, LDM, LAM]}
  - {type: flank_unit, slots: [RB, RDM, RAM]}
