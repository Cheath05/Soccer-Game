# Names for made-up home-based players (world/international/pools.py). A nation with at least
# `own_names_min` people in the save uses its own people's names. A nation with fewer uses
# its naming region: the names of the region's `donors` (nations with plenty of people in the
# game), its own few, and the region's own lists below. A nation not listed uses the whole save's
# names.
