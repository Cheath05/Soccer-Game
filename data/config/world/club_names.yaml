# Real club names for clubs that FC 27 lists under made-up names (it lacks the licences), or
# whose names lost their accents on the way out of it. Real club names are facts, not EA data.
# Grouped by nation (as named in nations.yaml); each entry maps the name in the source data to
# the real one. Applied when a world is built (importers/build_world.py), for saves already
# made by the v14 schema migration and again as each season starts (world/season.py
# ensure_leagues), and on the start page; renamed by the old name, so it is safe to run again.
Italy:
  Milano FC: AC Milan
  Lombardia FC: Inter
  Bergamo Calcio: Atalanta
  Latium: Lazio
# Liga MX clubs whose accented letters the source dropped (W9a B2; the clubs' own names,
# ligamx.net, read 16 Nov 2026).
Mexico:
  Atltico de SL: Atlético de San Luis
  Club Len: Club León
  FC Jurez: FC Juárez
  Quertaro FC: Querétaro FC
