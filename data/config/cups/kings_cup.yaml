# The King's Cup. Single matches with extra time and penalties; the final is at a neutral
# ground, in May after the league season. Round dates are in the season calendar
# (calendars/ksa-*.yaml, cups: KINGS_CUP), midweeks that keep clear of the league's own
# midweek rounds and of the Asian Cup break.
#
# Real life: lower-league clubs play the early rounds before the Pro League clubs join. The
# game has no clubs outside the Saudi Pro League, so its 18 start in the round of 32, of whom
# the 14 highest-ranked are exempt (byes) for the round of 16 to have its 16.
key: KINGS_CUP
name: King's Cup
short_name: King's Cup
nation: KSA
entrants:
  - {league: KSA1, round: 1}
rounds:
  - {name: Round of 32, qualifiers: 16}
  - {name: Round of 16}
  - {name: Quarter-final}
  - {name: Semi-final}
  - {name: Final, neutral: true}
