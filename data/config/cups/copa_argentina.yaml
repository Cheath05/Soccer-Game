# The Copa Argentina (W9a B2). Source: "2026 Copa Argentina" (English Wikipedia; AFA): 64 clubs
# from every division, single matches at neutral grounds, a level match going straight to
# penalties (no extra time). Round dates are in calendars/arg-*.yaml (cups: COPA_ARGENTINA).
#
# The lower divisions aren't in the data, so the cup is the Liga Profesional's 30 clubs from the
# round of 32, of whom the two highest-ranked are exempt (byes) for the round of 16 to have its 16.
key: COPA_ARGENTINA
name: Copa Argentina
short_name: Copa Argentina
nation: ARG
entrants:
  - {league: ARG1, round: 1}
rounds:
  - {name: Round of 32, qualifiers: 16, neutral: true, extra_time: false}
  - {name: Round of 16, neutral: true, extra_time: false}
  - {name: Quarter-final, neutral: true, extra_time: false}
  - {name: Semi-final, neutral: true, extra_time: false}
  - {name: Final, neutral: true, extra_time: false}
