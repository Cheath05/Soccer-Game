  CM: CM
  CAM: AM
  LM: LM
  RM: RM
  LW: LW
  RW: RW
  ST: ST
  CF: ST
  LF: LW
  RF: RW

# Source league -> competition key (leagues we simulate). Other leagues are imported as a
# dormant player pool: their clubs and players exist, age and can be bought.
leagues:
