# The Swiss Cup. Single matches with extra time and penalties; the final is at the Wankdorf in
# Bern, here after the league season (real life: on Whit Sunday).
#
# Real life: amateur and lower-league clubs play the early rounds. The game has only the Super
# League's 12, so they start in a round of 16, of whom the 4 highest-ranked are exempt (byes),
# for the quarter-finals to have their 8.
# Round dates are in the season calendar (calendars/sui-*.yaml, cups: SWISS_CUP).
key: SWISS_CUP
name: Swiss Cup
short_name: Swiss Cup
nation: SUI
entrants:
  - {league: SUI1, round: 1}
rounds:
  - {name: Round of 16, qualifiers: 8}
  - {name: Quarter-final}
  - {name: Semi-final}
  - {name: Final, neutral: true}
