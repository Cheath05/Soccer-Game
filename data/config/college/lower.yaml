# NCAA Divisions II and III (W9e; world/college/lower.py): real schools in their conferences
# (ncaa_d2.yaml, ncaa_d3.yaml), played with the quick results engine. They are where the
# high-school seniors D-I didn't sign go on developing, and their standouts can enter the transfer
# portal to D-I. Nobody coaches them: their programs are run by the game.
#
# Dates are MM-DD in the game's July-June season, as in rules.yaml.

divisions:
  2:
    key: NCAA2
    name: NCAA Division II Men's Soccer
    short_name: NCAA D-II
    programs: ncaa_d2.yaml
    # A program's level (its sophomores' mean overall, as in D-I) by tier: a top D-II program is
    # about a weak D-I one.
    level_by_tier: {1: 42.0, 2: 40.0, 3: 38.0, 4: 36.0, 5: 34.0}
    reputation: 14
    tournament:
      teams: 36  # the real field: conference champions and at-large teams
      selection: "11-09"
      rounds: ["11-13", "11-15", "11-20", "11-22", "12-04", "12-06"]
      round_names: [First round, Second round, Third round, Quarterfinals, Semifinals, Final]
      neutral_from: 4
  3:
    key: NCAA3
    name: NCAA Division III Men's Soccer
    short_name: NCAA D-III
    programs: ncaa_d3.yaml
    level_by_tier: {1: 38.0, 2: 36.0, 3: 34.0, 4: 32.0, 5: 30.0}
    reputation: 10
    tournament:
      teams: 64
      selection: "11-09"
      rounds: ["11-12", "11-15", "11-19", "11-22", "12-04", "12-06"]
      round_names: [First round, Second round, Third round, Quarterfinals, Semifinals, Final]
      neutral_from: 4

level_sd: 1.2
roster_size: 22  # the first 22 of D-I's roster shape (rules.yaml)

regular_season:
  # Each team plays its conference once and fills the rest with non-conference games, as in D-I.
  start: "08-28"
  end: "11-07"
  matches: 14
  slots: 16

# The transfer portal (one way: D-II/D-III to D-I). On this day each season the lower divisions'
# best non-seniors enter it: at most ``entrants``, by their grade (overall and potential, as a
# high-school recruit's), each at least ``min_overall`` now. They join D-I's recruiting class:
# offers, decisions and signing day as for a high-school senior; signed, he moves up at the
# rollover a class on; unsigned, he stays where he is.
portal:
  opens: "12-08"
  entrants: 60
  min_overall: 43.0

# The All-Division Tournament (22 Nov; world/college/all_division.py): once D-I's College Cup
# and the D-II and D-III finals are played, each division's best meet to settle which is the
# best team in college soccer. A division's champion is its first, then its best by the final
# RPI. The best enter latest: D-I's top four have two byes (they start in the Round of 16), D-I's
# next four and the top four of D-II and D-III one. Each round is drawn when the one before it
# ends: the best seed left meets the worst left from another division, the better seed at home
# until the semifinals; extra time, then penalties.
all_division:
  key: NCAAALL
  name: NCAA All-Division Tournament
  short_name: All-Division Tournament
  selection: "12-15"
  entries:  # division -> how many enter in each round, the first round first
    1: [8, 4, 4]  # D-I: 9th-16th in the first round, 5th-8th the second, the top 4 the third
    2: [8, 4]  # D-II: 5th-12th in the first round, the top 4 the second
    3: [8, 4]
  rounds: ["12-16", "12-18", "12-20", "12-22", "12-27", "12-29"]
  round_names: [First round, Second round, Round of 16, Quarterfinals, Semifinals, Final]
  neutral_from: 4
