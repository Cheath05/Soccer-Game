# The Belgian Cup. Single matches with extra time and penalties, except the semi-finals over two
# legs; the final is at the King Baudouin Stadium in Brussels, in May after the league season.
# Round dates are in the season calendar (calendars/bel-*.yaml, cups: BELGIAN_CUP), midweeks.
#
# Real life: lower-league and amateur clubs play the early rounds before the Pro League clubs
# join. The game has no clubs outside the Pro League, so its 18 start in the round of 32, of
# whom the 14 highest-ranked are exempt (byes) for the round of 16 to have its 16.
key: BELGIAN_CUP
name: Belgian Cup
short_name: Belgian Cup
nation: BEL
entrants:
  - {league: BEL1, round: 1}
rounds:
  - {name: Round of 32, qualifiers: 16}
  - {name: Round of 16}
  - {name: Quarter-final}
  - {name: Semi-final, legs: 2}
  - {name: Final, neutral: true}
