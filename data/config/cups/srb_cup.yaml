# Serbian Cup (W7). Single matches with extra time and penalties, on Tuesdays the league keeps
# free (its midweek rounds are Tuesdays); the final at a neutral ground after the league season. The game has only the top division's 14 clubs, who start
# in the first round shown (the best-ranked exempt where the numbers need byes).
# Real format: No 2026-27 Serbian Cup page exists on Wikipedia yet, so this is the 2025-26 format: 36 clubs, all single-legged ties decided by a penalty shoot-out if level after 90 minutes (the 2025-26 final went to extra time and then penalties). Preliminary round (10 Sep 2025, 38 clubs reduced to 32), round of 3
key: SRB_CUP
name: "Serbian Cup"
short_name: "Serbian Cup"
nation: SRB
entrants:
  - {league: SRB1, round: 1}
rounds:
  - {name: First round, qualifiers: 8, blocks: [SRB1]}
  - {name: Quarter-final, blocks: [SRB1]}
  - {name: Semi-final, blocks: [SRB1]}
  - {name: Final, neutral: true}
