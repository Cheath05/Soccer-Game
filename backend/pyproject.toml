[project]
name = "footsim"
version = "0.1.0"
description = "Local football management simulation: simulation core and API"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "numpy>=2.1",
    "scipy>=1.14",
    "pyyaml>=6.0",
]

[project.scripts]
footsim = "footsim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "httpx2>=2.13.1",
    "scipy-stubs>=1.18.1.1",
]
data = [
    "duckdb>=1.1",
    "kagglehub>=1.0.2",
    "pandas>=2.2",
    "rapidfuzz>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src directly: macOS can mark .venv files hidden, and Python 3.13 skips hidden .pth files.
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["footsim"]
mypy_path = "src"
