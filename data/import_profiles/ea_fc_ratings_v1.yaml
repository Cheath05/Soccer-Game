# Attributes EA doesn't publish. Weighted sum of other attributes (in canonical names),
# plus deterministic per-player noise. `max` takes the larger of several attributes, so an
# attacker's anticipation leans on off-ball movement and a defender's on positioning.
# `goalkeepers_only`: outfield players get the mean of their goalkeeping attributes instead.
derived:
  natural_fitness:
    terms: [{attr: stamina, w: .70}, {attr: strength, w: .30}]
    noise_sd: 5
  anticipation:
    terms: [{attr: reactions, w: .55}, {max: [off_ball, def_positioning], w: .45}]
    noise_sd: 3
  decisions:
    terms: [{attr: reactions, w: .45}, {attr: composure, w: .30}, {attr: vision, w: .25}]
    noise_sd: 3
  concentration:
    terms: [{attr: reactions, w: .45}, {attr: composure, w: .35},
            {max: [def_positioning, off_ball], w: .20}]
    noise_sd: 4
  work_rate:
    terms: [{attr: stamina, w: .60}, {attr: aggression, w: .40}]
    noise_sd: 6
  teamwork:
    terms: [{attr: vision, w: .35}, {attr: short_passing, w: .35}, {attr: reactions, w: .30}]
    noise_sd: 6
  bravery:
    terms: [{attr: aggression, w: .50}, {attr: strength, w: .25}, {attr: jumping, w: .25}]
    noise_sd: 6
  flair:
    terms: [{attr: dribbling, w: .45}, {attr: curve, w: .25}, {attr: agility, w: .15},
            {attr: vision, w: .15}]
    noise_sd: 5
  marking:
    terms: [{attr: def_positioning, w: .50}, {attr: standing_tackle, w: .25},
            {attr: agility, w: .15}, {attr: strength, w: .10}]
    noise_sd: 3
  gk_throwing:
    terms: [{attr: gk_kicking, w: .70}, {attr: gk_handling, w: .30}]
    noise_sd: 4
    goalkeepers_only: true
  gk_one_on_ones:
    terms: [{attr: gk_reflexes, w: .45}, {attr: gk_diving, w: .35}, {attr: gk_positioning, w: .20}]
    noise_sd: 4
    goalkeepers_only: true
  gk_command_of_area:
    terms: [{attr: gk_handling, w: .50}, {attr: jumping, w: .30}, {attr: gk_positioning, w: .20}]
    noise_sd: 5
    goalkeepers_only: true
  gk_rushing_out:
    terms: [{attr: gk_positioning, w: .35}, {attr: reactions, w: .35}, {attr: acceleration, w: .30}]
    noise_sd: 5
    goalkeepers_only: true

# PlayStyle bonuses to *derived* attributes (EA's own attributes already reflect them).
# A PlayStyle+ (trailing "+") applies the bonus times plus_multiplier.
plus_multiplier: 1.6
playstyle_effects:
  Anticipate: {anticipation: 6}
  Intercept: {anticipation: 3}
  Relentless: {work_rate: 8, natural_fitness: 4}
  Press Proven: {work_rate: 3}
  Bruiser: {bravery: 5}
  Enforcer: {bravery: 4}
  Aerial Fortress: {bravery: 3}
  Trickster: {flair: 8}
  Inventive: {flair: 6}
  Gamechanger: {flair: 5}
  Technical: {flair: 4}
  Rush Out: {gk_rushing_out: 10}
  Cross Claimer: {gk_command_of_area: 10}
  Far Throw: {gk_throwing: 10}
  Footwork: {gk_one_on_ones: 6}
  Far Reach: {gk_one_on_ones: 3}

