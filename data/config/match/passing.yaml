# Passing, first touch and clearances in the agent engine.
#
# A pass leaves the passer's foot with an error in direction and length that grows with the
# distance and the pressure on him, and shrinks with his passing skill. The receiver gets one
# touch to control it: a poor first touch, especially with an opponent close, knocks the ball
# loose. Clearances under pressure are often simply put out of play.
# Real references (Premier League): pass accuracy about 82-84% overall, about 90% short,
# 50-60% long; 33-38 throw-ins a match.

execution:
  base: 0.015            # radians of direction error for anyone
  skill: 0.10            # extra error for a passer with no skill at all (scaled by 1 - skill)
  pressure: 0.07         # extra error with an opponent right on him
  fatigue: 0.03          # extra error when exhausted
  per_metre: 0.008       # extra error per metre beyond 15 m
  lofted: 0.015          # a ball in the air is harder to place
  length_skill: 0.07     # spread of how far the pass goes (fraction of its length)
  length_per_metre: 0.022  # grows with distance: long balls are often over- or under-hit.
                           # per_metre and length_per_metre are Step 2.3 round 5's "e2" values,
                           # which every Step 2.3 measurement uses; provisional until 2.3e
                           # fits them with the rating terms
control:
  receiver: 0.95         # the intended receiver, before first touch and pressure
  teammate: 0.85         # another teammate getting to it
  touch_skill: 0.1       # how much his first touch matters: the chance is scaled by
                         # (1 - touch_skill) + touch_skill * first_touch / 100
  read_delay: [0.2, 0.6]  # s before the receiver reads where a pass is really going: he first
                          # moves to where it was meant to go (0.2 s with anticipation 100, 0.6 s
                          # with 0)
  retouch_lockout: 0.6   # s after a heavy touch before the same player can touch it again: the
                          # ball has got away from him, and it's a contest
  pressure_radius: 2.5   # an opponent this close pressures the first touch
  pressure_penalty: 0.3  # worst-case drop in control chance with an opponent on top of him
  heavy_touch_speed: [2.5, 5.5]  # m/s a miscontrolled ball runs away at
pace:                     # how hard ground passes are struck, and how the ball slows
  roll_friction: 4.0      # m/s^2 a ball on the ground loses (every rolling ball, not only passes)
  arrive: 6.0             # m/s a ground pass reaches its target at...
  arrive_per_metre: 0.17  # ...plus this much per metre of the pass. With the friction this gives
                          # Metrica's real travel times: 0.99 s for 9.5 m, 1.60 s for 20 m
                          # (docs/calibration/20260930-pass-pace-metrica.md)
  arrive_back: 2.0        # m/s for a pass back towards our own goal area, played softly
  back_zone: 20.0         # m from our own goal line where that applies
estimate:                 # the passer's estimate of a pass, where the ball's models leave gaps
  honest: false           # Step 2.3c, work in progress: true uses the estimate built from the
                          # ball's own models (not yet honest enough; see progress.md)
  reach_scale: 2.5        # m: a receiver arriving this much late still gets it about 1 in 3 times
  regather: [0.65, 0.2]   # a heavy touch won back by his side: nobody near, an opponent on him
                          # (measured after Step 2.3b: about half overall)
  opponent_reaction: 0.35 # s before an opponent starts closing a pass's path
clearance_wide_share: 0.45   # clearances under pressure aimed out wide, often out of play
aerial_contest_radius: 3.0   # an opponent this close to where a long ball drops contests it
header_to_feet: 0.7          # a receiver who wins the header keeps it (else it runs loose)
intercept_scale: 0.2         # how readily an opponent in a pass's path cuts it out. It scales
                             # both the physics and the passer's reading of the lane. 1.0 was
                             # the original model: 64-74 interceptions a match (round 5, 200
                             # matches per division; real 14-26). 0.2 is round 5's f020e2, which
                             # every Step 2.3 measurement uses; provisional until 2.3e
target_area: 3.0             # m around a pass's target. An opponent who takes the ball while
                             # it's still on course for this area intercepts it; one it comes to
                             # (overhit or off target) recovers it. Stats and commentary only.
