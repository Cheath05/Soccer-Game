# Player development, applied on the first of every month (people/development.py).
#
# Over a career a player grows towards his ceiling: his hidden potential, and for some a little
# beyond it. He reaches it in his prime, holds it, and declines from his early thirties, his
# physical attributes first. A rare few, nearly all of them very good players, keep their prime
# into their late thirties ("ageless").
#
# Each month's change is split: part of it lands on a few individual attributes (most often the
# ones that matter in his position), and the rest builds up until his overall moves by a whole
# point, when every attribute moves together.

growth_by_age:            # (up to age, share of the gap to his ceiling closed in a year)
  - [19, 0.30]
  - [22, 0.35]
  - [25, 0.42]
  - [28, 0.55]
late_growth: 0.15         # between his peak and his decline: what's left closes slowly
minutes:                  # (minutes in the past twelve months up to, growth factor)
  - [450, 0.55]
  - [1350, 0.8]
  - [2700, 1.0]
heavy_minutes: 1.1        # a regular starter's

# A place in the first team counts for more than the minutes on the pitch. Two rewards, the same
# for every club (the user's and the computer's):
#
# Bench credit. A player named among the substitutes who isn't used is still training and
# travelling with the first team, so each such match counts as a few minutes in the table above,
# as if he had played them. The credit is a running total that fades a little every month (it
# keeps about 11/12 of itself), so it never piles up. Named on the bench for every league match,
# season after season, a player carries about 900 minutes of credit: enough to lift him from the
# lowest band (450 or fewer, growth x0.55) into the next (x0.8), but a long way short of a regular
# starter's (x1.0 to x1.1). Minutes he really plays count in full, on top of it.
bench_credit_minutes: 20  # minutes credited each match he is named a substitute and stays on
bench_decay: 0.917        # the share of that credit still there a month later (about 11/12)

# Academy boost. A young player who came up through his own club's academy (he has, or had, a
# youth contract with the club he plays for now) and plays in its first team week after week
# turns out better than his scouting report said: each month he qualifies, his potential, the
# ceiling he is growing towards, rises a little. To qualify he must be 21 or younger and have
# played 1,800 minutes or more in the past twelve months (about twenty full matches). Only real
# minutes count here, not bench credit. At 3 points a year it takes nearly three years to add the
# most it ever will (8 points), and it never lifts a potential past 94. The boost is kept as a
# fraction that carries from month to month and reaches his potential in whole points. The points
# stay if he stops playing or moves on; he just stops gaining more.
academy_max_age: 21               # in whole years, as shown: 21 until his 22nd birthday
academy_regular_minutes: 1800     # real minutes in the past twelve months to count as a regular
academy_boost_per_year: 3         # potential points a year while he qualifies
academy_boost_cap: 8              # the most it ever adds to one player's potential, in all
academy_potential_ceiling: 94     # and it never lifts a potential above this

peak_age: [26, 29]        # each player's own peak age, drawn from this range
beyond_potential:         # (chance, low, high): how far above his potential his ceiling sits
  - [0.20, 1, 2]
  - [0.08, 3, 4]
  - [0.02, 5, 7]
decline_start: [31, 33]   # the age each player starts to decline, drawn from this range
decline_by_year: [-0.5, -1.0, -1.6, -2.3, -3.0, -3.8]   # overall a year, then the last value on
ageless_chance:           # (from potential, chance) of keeping his prime into his late thirties
  - [0, 0.002]
  - [80, 0.01]
  - [85, 0.04]
  - [88, 0.10]
ageless_delay: 4          # years later his decline starts
ageless_slowdown: 0.5     # and it runs at this share of the normal pace
noise: 1.0                # a year's random swing in overall (sd), spread over the months
specific_share: 0.4       # of each month's change, on individual attributes; the rest builds up
                          # into whole-point moves of every attribute
news_min_change: 0.5      # the news names a player only when his overall moved this much in the
                          # month, so one sitting on x.5 doesn't flicker up and down in it
trend_memory: 0.7         # a player's trend: his monthly change in overall, smoothed (the share
                          # of last month's trend kept), so one month's noise doesn't flip it
trend_shown: 0.12         # overall a month (about 1.5 a year) that shows the green up or red
                          # down arrow by his overall

# Position training (the user's choice of a position for a player to learn). Each month his
# familiarity there grows by `rate_per_month`, faster when young (`age_factor`: (age up to,
# multiplier)), until he's natural in it (`natural`, the familiarity at which he plays it at his
# full rating: ratings/overall.py familiarity bands). Familiarity runs 0-20.
position_training:
  rate_per_month: 1.0
  age_factor:
    - [21, 1.5]
    - [25, 1.2]
    - [29, 1.0]
    - [32, 0.7]
    - [99, 0.5]
  natural: 18
