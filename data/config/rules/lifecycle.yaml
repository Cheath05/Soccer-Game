# Careers ending and starting, at the end of each season (world/lifecycle.py).
#
# Without these nobody retired and nobody new arrived, so after a few seasons squads aged and
# thinned out. Now players retire, mostly from their mid-thirties, and every club takes in a
# few youngsters from its academy each year. A club's reputation stands in for its academy
# until academies are built (W5).

retirement:
  by_age:                 # (from age, chance he retires at a season's end)
    - [32, 0.03]
    - [33, 0.06]
    - [34, 0.12]
    - [35, 0.22]
    - [36, 0.35]
    - [37, 0.50]
    - [38, 0.65]
    - [39, 0.80]
    - [40, 0.95]
  keeper_years: 2         # keepers play two years longer
  ageless_factor: 0.4     # the rare players who keep their prime (development.yaml) play on
  good_from: 78           # a player still this good keeps going longer...
  good_factor: 0.6
  poor_below: 55          # ...and one this poor stops sooner
  poor_factor: 1.5
  free_agent_factor: 1.8  # nobody has signed him
  free_agent_leave: 0.5   # a free agent still unsigned at a season's end leaves the professional
                          # game (drops out of the leagues the game has) with this chance, at
                          # any age: until transfers (W4) can sign him, nobody will
  news_from: 80           # other clubs' players this good make the news when they retire

youth:
  intake:                 # (club reputation from, youngsters a year)
    - [0, 2]
    - [45, 3]
    - [65, 4]
    - [80, 5]
  ages: [15, 17]
  overall:                # (club reputation from, the mean overall of a new youngster)
    - [0, 40.0]
    - [45, 44.0]
    - [65, 48.0]
    - [80, 52.0]
  overall_sd: 4.0
  potential:              # (club reputation from, the mean potential of a new youngster)
    - [0, 58.0]
    - [45, 63.0]
    - [65, 68.0]
    - [80, 72.0]
  potential_sd: 8.0       # so about 1 in 40 at the best academies is a future 88+
  potential_room: 6.0     # his potential at least this far above his overall
  max_potential: 94
  home_nation: 0.85       # the rest from the countries his club's players come from
  positions: {GK: 0.09, CB: 0.17, RB: 0.075, LB: 0.075, DM: 0.08, CM: 0.15, AM: 0.08,
              RW: 0.065, LW: 0.065, ST: 0.15}
  contract_age: 19        # his first contract runs to the end of the season he turns this

squads:
  max_players: 34         # a computer-run club with more releases its weakest down to this
  keep: 31                # many: worst first, a young player counting half his remaining
                          # potential. The user's squad is theirs to manage (they can release
                          # players).
