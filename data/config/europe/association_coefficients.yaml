# and 2026 country rankings, which agree on the seasons they share; fetched 15 Oct 2026). Each
# figure is that season's coefficient: the points the country's clubs earned in Europe divided by
# how many clubs it entered. A country's ranking is the sum of its last five seasons.
# Russia (suspended, and not in the game) is left out: 54 associations. The game adds its own
# seasons from 2026-27 on (world/europe/ranking.py). A season's access list uses the ranking at the
# end of the season two before it, as UEFA's does: 2026-27 uses 2020-21..2024-25.
