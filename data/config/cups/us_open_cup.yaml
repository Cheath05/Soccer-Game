# The Lamar Hunt U.S. Open Cup (W9a B2). Source: U.S. Soccer's 2026 format (Dec 2025): 16 MLS
# clubs join in the round of 32 (those not in the Leagues Cup or the Concacaf Champions Cup,
# ranked by the Supporters' Shield), single matches with extra time and penalties. Round dates
# are in calendars/usa-*.yaml (cups: US_OPEN_CUP).
#
# The game has no Leagues Cup and no clubs below MLS, so the 16 lowest-placed US clubs of last
# season's MLS table enter (`nation: USA`: the Canadian clubs play the Canadian Championship),
# straight into the round of 16, the earlier rounds against lower-division clubs left out. The
# draw gives each tie its host; the final is at the better-placed club, as U.S. Soccer awards it
# by a bid, usually to the higher seed. MLS has 27 US clubs: ranks 12 to 27 of them.
key: US_OPEN_CUP
name: U.S. Open Cup
short_name: U.S. Open Cup
nation: USA
entrants:
  - {league: USA1, round: 1, nation: USA, ranks: [12, 27]}
rounds:
  - {name: Round of 16}
  - {name: Quarter-final}
  - {name: Semi-final}
  - {name: Final, host: higher_ranked}
