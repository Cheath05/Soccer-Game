# The Canadian Championship (W9a B2), Canada's cup. Source: Canada Soccer's competition format
# (2025-26): the MLS clubs join in the quarter-finals; two-legged ties to the semi-finals, then
# a single final. Round dates are in calendars/usa-*.yaml (cups: CANADIAN_CHAMPIONSHIP), as its
# clubs play on MLS's dates.
#
# The Canadian Premier League and the amateur champions aren't in the data, so the cup is MLS's
# three Canadian clubs (`nation: CAN`, world/club_nations.yaml): a two-legged semi-final, the
# best-placed of last season with a bye, then the final, at the first-drawn club's ground, with
# extra time and penalties.
key: CANADIAN_CHAMPIONSHIP
name: Canadian Championship
short_name: Canadian Championship
nation: CAN
entrants:
  - {league: USA1, round: 1, nation: CAN, ranks: [1, 3]}
rounds:
  - {name: Semi-final, qualifiers: 2, legs: 2}
  - {name: Final}
