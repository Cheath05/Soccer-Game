# The iOS host app (docs/plans/commercial-ios-release.md, Track I). Generate the Xcode project
# with `xcodegen generate` in this folder (or `just ios-project`); the .xcodeproj isn't in git.
name: Footsim
options:
  bundleIdPrefix: com.alexbenton
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 8P3382NW8A
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"  # the Python build phase writes into the bundle
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Footsim:
    type: application
    platform: iOS
    sources:
      - path: Footsim
    dependencies:
      - framework: support/Python.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        # The personal build: your own world, on your own devices, never uploaded. The store
        # build gets its own bundle id (the plan's "Three builds").
        PRODUCT_BUNDLE_IDENTIFIER: com.alexbenton.footsim.personal
        PRODUCT_NAME: Footsim
        INFOPLIST_FILE: Footsim/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Footsim/Footsim-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS: "$(BUILT_PRODUCTS_DIR)/Python.framework/Headers"
    postCompileScripts:
      - name: Install the game and Python libraries
        basedOnDependencyAnalysis: false
        script: |
          set -e
          "$PROJECT_DIR/scripts/install_into_bundle.sh"
