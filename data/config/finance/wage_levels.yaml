# Rough weekly gross wages in EUR, used to give imported players a contract wage.
# Keys are source league names (EA spelling). reference_overall is about the league's
# average overall in FC 27, so reference_wage is a typical (median-ish) squad player's wage.
# These are coarse estimates from public wage surveys; tune freely.
