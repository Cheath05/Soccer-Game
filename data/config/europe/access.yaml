# Who qualifies for the European competitions ("realistic-lite", docs/plans/w6-european-
# competitions.md). Approximate: the real 2024-27 access list follows the associations'
# ranking and has four qualifying rounds; here each competition has one summer play-off round,
# and the numbers are fitted to the countries in the game so each league phase has 36.
#
# A place is a league finish (nation and ranks: the country's top league; for a country with
# no league in the game, its clubs in that season's lottery order, europe/settings.yaml), a
# domestic cup's winner (cup), or a competition's last winner (holder). A club is placed in the
# highest competition it earns; its other place goes to the best-placed club of the same
# country not yet in Europe (a cup's place to the cup country's top league). Places nobody
# can take (no holder yet, a league not in the career) are filled last, by the ``fill``
# countries in turn: the first by the first's next club, the second by the second's... The losers of a competition's play-off round drop into the next
# competition's league phase (competitions/*.yaml qualifying.losers_to).
# The cup places of Poland, Romania, Sweden, Norway, Denmark, Switzerland and Austria (15 Oct, when
# their leagues joined the game) took the place of one of their league places each, so every
# competition's numbers are unchanged.
competitions:
  UCL:
    league_phase:              # 32: 2 holders, 30 by league
      - {holder: UCL}
      - {holder: UEL}
      - {nation: ENG, ranks: [1, 4]}
      - {nation: ITA, ranks: [1, 4]}
      - {nation: ESP, ranks: [1, 4]}
      - {nation: GER, ranks: [1, 4]}
      - {nation: FRA, ranks: [1, 3]}
      - {nation: NED, ranks: [1, 2]}
      - {nation: POR, ranks: [1, 2]}
      - {nation: BEL, ranks: [1, 1]}
      - {nation: TUR, ranks: [1, 1]}
      - {nation: CZE, ranks: [1, 1]}
      - {nation: GRE, ranks: [1, 1]}
      - {nation: NOR, ranks: [1, 1]}
      - {nation: POL, ranks: [1, 1]}
      - {nation: DEN, ranks: [1, 1]}
    qualifying:                # 8: 4 go through, 4 drop into the Europa League
      - {nation: AUT, ranks: [1, 1]}
      - {nation: SUI, ranks: [1, 1]}
      - {nation: SCO, ranks: [1, 1]}
      - {nation: CYP, ranks: [1, 1]}
      - {nation: BEL, ranks: [2, 2]}
      - {nation: TUR, ranks: [2, 2]}
      - {nation: CZE, ranks: [2, 2]}
      - {nation: GRE, ranks: [2, 2]}
    fill: [ENG, ITA, ESP, GER, FRA]
