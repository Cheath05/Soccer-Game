# NCAA Division I men's soccer, the 2026 season: programs and conference membership.
# Sources: Wikipedia "List of NCAA Division I men's soccer programs" (read 2026-11-16, reflects 2026-27 membership);
#   Wikipedia "2026 NCAA Division I men's soccer season" (read 2026-11-16: realignment list, conference standings,
#   conference tournament table, preseason United Soccer Coaches poll).
# Notes: 23 conferences, 213 programs, no independents in 2026 (UTRGV joined the OVC).
# Notes: 2026 changes: Mountain West began sponsoring men's soccer; Pac-12 reinstated it; WAC (now UAC) dropped it; MAAC renamed Metro Conference.
# Notes: 2026 moves: Denver Summit->WCC, Liberty OVC->SoCon, Northern Illinois MVC->Horizon, Utah Valley WAC->Big West, West Florida joined ASUN from D-II, Saint Francis (PA) left for D-III.
# Notes: Affiliates: Delaware and UMass play in the Summit; Kentucky, South Carolina, UCF, West Virginia in the Sun Belt; Missouri State in the American; Bowling Green and Western Michigan in the MVC.
# Notes: West Florida (D-I transition) is ineligible for the 2026 postseason; Le Moyne, Mercyhurst, New Haven are also still transitioning.
# Notes: Gonzaga's 2026 home is the Pac-12 (not the WCC); Grand Canyon plays in the Mountain West (not the WCC).
# Notes: 2027 changes (not applied): Fairfield Metro->CAA, Le Moyne NEC->Metro, UC San Diego Pac-12->WCC, UC Santa Barbara Big West->WCC.
# Notes: tournament sizes are estimates from 2024-25 formats and 2026 tournament dates/venues; exact 2026 field sizes were not confirmed.
# Notes: auto_bid true for all 23 (the 2026 season page says 23 conferences receive automatic bids).
# Notes: tiers are a judgement call from program history and 2025-26 results.
